<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>:root{color-scheme:light dark}body{font:16px sans-serif;max-width:680px;margin:24px auto;padding:20px}button,select,textarea{font:inherit;padding:10px;margin:6px 0}textarea{display:block;width:95%;min-height:70px}#status,#history{white-space:pre-wrap}#history{min-height:180px;max-height:40vh;overflow:auto;border:1px solid #888;padding:12px}#sessions{max-width:100%}</style><h1>手机联动 · 安全配对</h1><p id="status">正在认证设备…</p><select id="sessions" aria-label="会话"></select><button id="new">新建对话</button><button id="refresh">刷新</button><div id="history" aria-live="polite"></div><label>上传附件 <input id="attachment" type="file" multiple></label><textarea id="message" aria-label="消息" placeholder="给电脑主对话发送消息"></textarea><button id="send">发送</button><details><summary>浏览器推送</summary><button id="subscribe" disabled>允许浏览器推送并保存订阅</button><p>设备在前台时抑制推送。保存订阅不表示外部消息已经送达。</p></details><script src="/client.js"></script></html>
