name: ai_upper validation

# Only develop runs the matrix. Development happens on feature_* / fix_*
# branches cut from develop and merged back after self-testing, so their
# intermediate commits are not deliverable; what needs the fifteen jobs is the
# code that lands in develop and the review requests aimed at it. Branch
# filters are the whole policy -- a push anywhere else costs nothing.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # Manual re-runs from the CLI (gh workflow run validate.yml --ref develop)
  # and from the Actions page, so a failing job can be reproduced without
  # pushing an empty commit.
  workflow_dispatch:

jobs:
  build-tool-compat:
    name: Build Tool Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # app/pyproject.toml is the Git-ignored working copy; the repository ships
      # app/pyproject.toml.example.
      - name: Create the local configuration from the template
        run: python -c "import shutil; shutil.copyfile('app/pyproject.toml.example', 'app/pyproject.toml')"
      - name: Verify Build Tool imports
        run: |
          python -m compileall -q tools/ai_upper
          python -c "import sys; sys.path.insert(0, 'tools'); import ai_upper.config; import ai_upper.compat; print(sys.version)"
      - name: Run compatibility tests
        run: |
          # setuptools is a real build dependency here: the Windows target
          # extensions are compiled by the setuptools driver the build writes,
          # and test_build_tool_compat exercises that driver directly. CPython
          # >= 3.12 no longer ships setuptools with the interpreter, so it has
          # to be installed explicitly.
          python -m pip install -U 'pip<25.1' 'setuptools' 'pytest<8'
          python -m pytest app/tests/test_build_tool_compat.py app/tests/test_ai_upper_config.py -q

  native-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            run: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            run: false
          - os: windows-2025
            target: windows-x86
            run: false
            # PySide6 publishes no 32-bit Windows wheel, so this job proves the
            # 32-bit toolchain, launcher and packaging path with the one
            # application dependency that does resolve for win32.
            dependencies: '["pyserial==3.5"]'
          - os: windows-2025
            target: windows-x86_64
            run: true
          # Python 3.8-3.12 embeddable runtimes ship _msi.pyd, which imports
          # msi.dll and Cabinet.dll from System32; Python 3.13 does not. Build
          # the oldest supported Windows runtime so the packaging path that
          # exposed the native-closure regression stays covered in CI.
          - os: windows-2025
            target: windows-x86_64
            runtime-python: '3.8.10'
            run: true
            # PySide6 6.11 has no cp38 wheel, and this job needs a real GUI
            # payload; PySide2 still publishes a cp38 win_amd64 wheel. The
            # rest of the pin set has to be spelled out here for the same
            # reason: the application's own pins in app/requirements.txt
            # require >=3.10 (pydantic 2.14.3 itself declares Requires-Python
            # >=3.10), so this entry pins the last cp38-compatible major of
            # each dependency instead of reusing that list.
            dependencies: '["PySide2==5.15.2.1", "pydantic==2.10.6", "httpx==0.28.1", "cryptography==46.0.3", "keyring==24.3.1"]'
            # Keep this compatibility build out of the seven-target release
            # manifest: it duplicates windows-x86_64 and is not a release artifact.
            artifact: py38-compat-windows-x86_64
          - os: windows-11-arm
            target: windows-arm64
            run: true
          - os: macos-15-intel
            target: macos-x86_64
            run: true
          - os: macos-15
            target: macos-arm64
            run: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # app/pyproject.toml is the Git-ignored working copy; the repository ships
      # app/pyproject.toml.example, which pins no dependencies on purpose so a
      # fork never inherits someone else's. This job builds and runs the
      # repository's own application, so it materializes the copy with the
      # dependency set that application needs; the other jobs only need the file
      # to exist.
      - name: Create the local configuration with the repository's dependencies
        # The default shell on Windows runners is pwsh, which cannot run the
        # heredoc below ("<" is reserved). Bash ships with Git for Windows, so
        # every platform can run the same script.
        shell: bash
        env:
          # The application's own dependency set, unless the matrix entry
          # overrides it because no wheel of it exists for that target. The
          # default is read from app/requirements.txt further below, so this
          # list cannot drift away from what the application actually imports.
          AI_UPPER_CI_DEPENDENCIES: ${{ matrix.dependencies }}
          # The template pins the newest supported runtime. The Windows 3.8
          # compatibility entry overrides it to exercise the older runtime line.
          AI_UPPER_CI_RUNTIME_PYTHON: ${{ matrix.runtime-python || '3.13.5' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          # The default set is read from app/requirements.txt -- the file the
          # application itself pins and that the "Install application
          # dependencies" step installs -- instead of a second hand-written
          # list in this workflow. The previous inline list was never updated
          # when the application started importing pydantic / httpx /
          # cryptography / keyring, so every packaged build in CI bundled a
          # runtime without pydantic and step 14 died on
          # "ModuleNotFoundError: No module named 'pydantic'" while the source
          # test suite was green.
          def requirements() -> list[str]:
              pinned = []
              for line in Path('app/requirements.txt').read_text(encoding='utf-8').splitlines():
                  entry = line.split('#', 1)[0].strip()
                  if entry and not entry.startswith('-'):
                      pinned.append(entry)
              return pinned

          override = os.environ.get('AI_UPPER_CI_DEPENDENCIES', '').strip()
          dependencies = override or json.dumps(requirements())
          runtime_python = os.environ['AI_UPPER_CI_RUNTIME_PYTHON']
          text = Path('app/pyproject.toml.example').read_text(encoding='utf-8')
          text, runtime_replaced = re.subn(
              r'^python = "[^"]+"$',
              f'python = "{runtime_python}"',
              text,
              count=1,
              flags=re.M,
          )
          assert runtime_replaced == 1, 'app/pyproject.toml.example must declare one runtime Python version'
          text, dependencies_replaced = re.subn(
              r'^dependencies = \[\]$',
              f'dependencies = {dependencies}',
              text,
              count=1,
              flags=re.M,
          )
          assert dependencies_replaced == 1, 'app/pyproject.toml.example must declare an empty dependencies list'
          Path('app/pyproject.toml').write_text(text, encoding='utf-8')
          print('packaged dependencies:', dependencies)
          PY

      - name: Cache ai_upper build inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/pbs
            .cache/python.org
            .cache/pip
            build/wheels
          key: ai-upper-v0.17.9-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('app/pyproject.toml', 'app/pyproject.toml.example') }}

      - name: Install Python build tools
        run: python -m pip install -U pip setuptools wheel 'Cython>=3.1,<3.3' pytest

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The local-runtime E2E fixture copies setup-python's system-linked
          # stdlib libraries and relocates their search paths with patchelf.
          sudo apt-get install -y cmake ninja-build gcc g++ binutils patchelf
          # The bundled Qt GUI libraries link libEGL.so.1, which the runner
          # image does not carry (libGL.so.1 and libxkbcommon.so.0 it does).
          # Both the Qt pruning probe and the packaged smoke run load it.
          sudo apt-get install -y libegl1
          # Qt's own libQt6WebEngineCore.so.6 and QtWebEngineProcess link the
          # Chromium runtime dependencies. The x86_64 image happens to carry
          # most of them; ubuntu-24.04-arm carries far fewer, and each missing
          # one surfaces the same way: importing PySide6.QtWebEngineWidgets
          # dies on "libX.so.N: cannot open shared object file", which pytest 9
          # reports as a collection error (it deliberately does not turn a
          # found-but-unloadable module into a skip). Guessing one library per
          # run cost two runs already (libopus.so.0, then libminizip.so.1), so
          # this installs the non-Qt leaves of Ubuntu's own
          # libqt6webenginecore6 dependency list -- Qt's own libraries are
          # deliberately excluded, because the bundle ships its own copy and a
          # system Qt in the loader path could shadow it.
          sudo apt-get install -y \
            libdbus-1-3 libevent-2.1-7t64 libexpat1 libfontconfig1 \
            libfreetype6 libharfbuzz-subset0 libharfbuzz0b libicu74 \
            libjpeg8 liblcms2-2 libminizip1t64 libnspr4 libnss3 \
            libopenjp2-7 libopus0 libpng16-16t64 libsnappy1v5 libvpx9 \
            libwebp7 libwebpdemux2 libwebpmux3 libx11-6 libxcb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 \
            libxkbfile1 libxml2 libxrandr2 libxslt1.1 libxtst6 zlib1g \
            libgbm1 libasound2t64 libcups2t64 libegl1 libxi6 libxcursor1

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          cmake --version
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
          ninja --version

      # The application tests import the services the bundled app ships
      # (pydantic, httpx, cryptography, keyring) and, where Qt is present,
      # PySide6. Installing the working copy's own requirement set here keeps
      # the suite honest: the same pins the packaged build uses.
      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt

      # `tests/` has no `__init__.py`, so `from scripted_transport import ...`
      # resolves only when the test directory itself is on sys.path -- which is
      # what running pytest from `app/` does. Running it from the repository
      # root instead left `tests.scripted_transport` unimportable and failed
      # the step on every platform.
      #
      # `set -o pipefail` is load-bearing: `tee` exits 0, so without it a failing
      # pytest would turn this step green. The exit code is also recorded, since
      # the publish step below needs to know whether the log shows a failure.
      - name: Unit tests
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          rc=0
          python -m pytest tests -q -ra --tb=long 2>&1 | tee pytest.log || rc=$?
          echo "$rc" > pytest.exitcode
          exit "$rc"

      # The failure text has to be readable without repository admin rights: the
      # run/job log APIs answer 403 for anonymous callers even on a public
      # repository, so a red job used to leave nothing but "exit code 1".
      # Check-run annotations are public, so the tail of the log is emitted as
      # an annotation; the step summary and the uploaded artifact keep the rest.
      - name: Publish unit test log
        if: always()
        shell: bash
        run: |
          log=app/pytest.log
          rc="$(cat app/pytest.exitcode 2>/dev/null || echo 255)"
          {
            echo '### Unit tests — ${{ matrix.target }} (${{ matrix.os }})'
            echo ''
            echo "pytest exit code: $rc (0 = passed, 1 = test failure, 2 = collection error)"
            if [ -f "$log" ]; then
              echo ''
              echo '```'
              tail -n 400 "$log"
              echo '```'
            else
              echo ''
              echo 'pytest.log was not created: the step failed before pytest ran.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub keeps the FIRST 4096 characters of an annotation message, so
          # handing it the log tail verbatim is not enough: one long line is
          # enough to push the failure out of view. tools/ci_tail.py emits the
          # diagnostic lines themselves and only falls back to an end-first
          # tail that fits.
          python tools/ci_tail.py \
            --log "$log" \
            --title "pytest (exit $rc)" \
            --exit-code-file app/pytest.exitcode \
            --label pytest.log

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.artifact || matrix.target }}
          path: app/pytest.log
          if-no-files-found: warn
          retention-days: 14

      - name: Local end-to-end build with third-party wheel
        working-directory: app
        env:
          AI_UPPER_E2E: '1'
        run: python -m pytest tests/test_e2e_local.py -q

      - name: Doctor
        run: python tools/build.py --doctor --target ${{ matrix.target }}

      # The build is the longest step and it is where a missing host tool
      # (cmake, ninja, a compiler, a toolchain) shows up. Without this block its
      # failure left exactly "exit code 1" and no text: the job log needs a
      # token that anonymous callers do not have, and the annotations only carry
      # the run below. `pipefail` keeps the real exit code behind `tee`.
      - name: Full integration build
        shell: bash
        run: |
          set -o pipefail
          rc=0
          python tools/build.py --target ${{ matrix.target }} 2>&1 | tee build.log || rc=$?
          echo "$rc" > build.exitcode
          exit "$rc"

      - name: Publish build log
        if: always()
        shell: bash
        run: |
          log=build.log
          if [ -f build.exitcode ]; then
            rc="$(cat build.exitcode)"
          else
            # The build step never ran (an earlier step failed, so the job is
            # already red). Inventing an exit code here would file a second,
            # misleading "build.py failed" annotation against a build that was
            # never attempted -- exactly what happened on windows-arm64, where a
            # unit test failure produced "build.py (exit 255) (no build.log)".
            echo '### Full integration build — ${{ matrix.target }} (${{ matrix.os }})'
            echo ''
            echo 'Not run: an earlier step in this job failed.'
            echo 'Not run: an earlier step in this job failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Full integration build — ${{ matrix.target }} (${{ matrix.os }})'
            echo ''
            echo "build.py exit code: $rc"
            if [ -f "$log" ]; then
              echo ''
              echo '```'
              tail -n 400 "$log"
              echo '```'
            else
              echo ''
              echo 'build.log was not created: the build step failed before it could write one.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub keeps the FIRST 4096 characters of an annotation message, so
          # the log tail verbatim is not enough: a few `cl.exe` command lines
          # are already longer than that, and the only thing left readable was
          # the compiler invocation instead of its diagnostic. tools/ci_tail.py
          # emits the diagnostic lines themselves, and an end-first tail when
          # nothing matches.
          if [ "$rc" != "0" ]; then
            python tools/ci_tail.py \
              --log "$log" \
              --title "build.py (exit $rc)" \
              --exit-code-file build.exitcode \
              --label build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.artifact || matrix.target }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Full integration run
        if: matrix.run == true
        shell: bash
        env:
          AI_UPPER_HEADLESS: '1'
          # A failed launcher must exit non-zero, never block the job on a
          # native error dialog that nobody can dismiss.
          AI_UPPER_NO_DIALOG: '1'
        run: |
          set -o pipefail
          # Keep the real exit code: the assertion below is a separate process.
          rc=0
          python tools/build.py --run --target ${{ matrix.target }} > run.log 2>&1 || rc=$?
          {
            echo '### Full integration run — ${{ matrix.target }}'
            echo ''
            echo "build.py --run exit code: $rc"
            echo ''
            echo '```'
            tail -n 400 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat run.log
          # The entry point is deva_web.py, so the readiness marker is the one
          # it prints once the renderer loaded and the JS bridge is up. Asserting
          # on the template app's "GUI OK" passed only when this step silently
          # ran a different entry.
          #
          # The marker check runs before the annotation is emitted: a run that
          # exits 0 without printing the marker is a failure too, and it used to
          # leave an "exit 0" notice as the only readable text.
          marker=1
          if ! python - <<'PY'
          import pathlib
          import sys

          text = pathlib.Path('run.log').read_text(encoding='utf-8', errors='replace')
          print(text[-3000:])
          ok = 'DEVA WEB OK' in text and 'bridge=True' in text
          if not ok:
              print('MISSING MARKER in run.log:', repr(text[-400:]), file=sys.stderr)
          sys.exit(0 if ok else 1)
          PY
          then
            marker=0
          fi
          # Annotations are readable without admin rights; job logs are not.
          # Only a failed run emits an error, or every green job would carry one.
          # The annotation carries diagnostic lines, not a raw tail: GitHub keeps
          # only the first 4096 characters of the message, which on Windows a
          # few command lines already exhaust.
          if [ "$rc" != "0" ]; then
            python tools/ci_tail.py \
              --log run.log \
              --title "run.log (build.py --run exit $rc)" \
              --label run.log
          elif [ "$marker" != "1" ]; then
            python tools/ci_tail.py \
              --log run.log \
              --title "run.log (build.py --run exit 0, readiness marker missing)" \
              --label run.log
          else
            python tools/ci_tail.py \
              --log run.log \
              --title "run.log (build.py --run exit 0)" \
              --level notice \
              --label run.log
          fi
          # Either failure is the step's failure: build.py --run exiting non-zero
          # and a run that "succeeded" without printing the marker.
          if [ "$rc" != "0" ] || [ "$marker" != "1" ]; then
            exit 1
          fi

      - name: Upload integration run log
        if: always() && matrix.run == true
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ matrix.artifact || matrix.target }}
          path: run.log
          if-no-files-found: warn
          retention-days: 14

      - name: Validate packaged release manifest inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('dist')
          files = [p for p in root.rglob('*') if p.is_file()]
          assert files, 'dist is empty'
          for p in files:
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assert len(h) == 64
          print(f'validated {len(files)} packaged files')
          PY

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact || format('ai-upper-{0}', matrix.target) }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  aggregate-artifacts:
    needs: native-integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # app/pyproject.toml is the Git-ignored working copy; the repository ships
      # app/pyproject.toml.example.
      - name: Create the local configuration from the template
        run: python -c "import shutil; shutil.copyfile('app/pyproject.toml.example', 'app/pyproject.toml')"

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ai-upper-*
          path: collected
          merge-multiple: false

      - name: Build aggregate release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import tomllib

          root = Path('collected')
          project = tomllib.loads(Path('app/pyproject.toml').read_text(encoding='utf-8'))['project']
          entries = []
          for artifact in sorted(p for p in root.iterdir() if p.is_dir()):
              target = artifact.name.removeprefix('ai-upper-')
              dist = artifact / 'dist'
              if not dist.exists():
                  dist = artifact
              files = []
              for path in sorted(p for p in dist.rglob('*') if p.is_file()):
                  files.append({
                      'path': path.relative_to(dist).as_posix(),
                      'size': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
              entries.append({'target': target, 'files': files})

          data = {
              'format': 1,
              'project': 'ai_upper',
              'version': str(project['version']),
              'targets': entries,
          }
          Path('collected/release-manifest.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({'version': data['version'], 'targets': [x['target'] for x in entries]}, indent=2))
          assert len(entries) == 7, f'expected 7 native targets, got {len(entries)}'
          PY

      - name: Upload aggregate validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-upper-release-manifest
          path: collected/release-manifest.json
          if-no-files-found: error
          retention-days: 30
